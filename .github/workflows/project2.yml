name: Project 2 tests - report to Teams

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["Project2/**", ".github/workflows/project2.yml", ".github/scripts/**"]

jobs:
  test-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: .NET unit tests
        id: dotnet
        continue-on-error: true
        working-directory: Project2/api
        run: dotnet test --logger "trx;LogFileName=results.trx"

      - name: Angular unit tests
        id: angular
        continue-on-error: true
        working-directory: Project2/web
        run: |
          npm ci
          npx ng test --watch=false --reporters=junit --output-file=test-results/junit.xml

      - name: Start the API and Angular app
        timeout-minutes: 5
        run: |
          dotnet run --project Project2/api/SampleApi --urls http://127.0.0.1:5004 > api.log 2>&1 &
          (cd Project2/web && npx ng serve --host 127.0.0.1 --port 4201 --proxy-config proxy.conf.json > ng.log 2>&1 &)
          if ! npx --yes wait-on -t 180000 http-get://127.0.0.1:5004/api/health http-get://127.0.0.1:4201; then
            echo "--- api.log"; cat api.log
            echo "--- ng.log"; cat Project2/web/ng.log
            exit 1
          fi

      - name: Bruno API tests
        id: bruno
        continue-on-error: true
        working-directory: Project2/bruno
        run: |
          npm install
          npm test

      - name: Playwright UI tests
        id: playwright
        continue-on-error: true
        working-directory: Project2/playwright
        run: |
          npm install
          npx playwright install --with-deps chromium
          npm test

      - name: Summarise results
        id: summary
        if: always()
        run: |
          # Bruno writes one testsuite per request, so add them up. The other tools put totals on the first match.
          sum()   { grep -o " $2=\"[0-9]*\"" "$1" 2>/dev/null | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}'; }
          first() { grep -o " $2=\"[0-9]*\"" "$1" 2>/dev/null | head -1 | grep -o '[0-9]*' || echo 0; }
          TRX=$(find Project2/api -name results.trx | head -1)
          echo "d_total=$(first "$TRX" total)" >> "$GITHUB_OUTPUT"
          echo "d_failed=$(first "$TRX" failed)" >> "$GITHUB_OUTPUT"
          A=Project2/web/test-results/junit.xml
          echo "a_total=$(first $A tests)" >> "$GITHUB_OUTPUT"
          echo "a_failed=$(( $(first $A failures) + $(first $A errors) ))" >> "$GITHUB_OUTPUT"
          B=Project2/bruno/results/junit.xml
          echo "b_total=$(sum $B tests)" >> "$GITHUB_OUTPUT"
          echo "b_failed=$(( $(sum $B failures) + $(sum $B errors) ))" >> "$GITHUB_OUTPUT"
          P=Project2/playwright/results/junit.xml
          echo "p_total=$(first $P tests)" >> "$GITHUB_OUTPUT"
          echo "p_failed=$(( $(first $P failures) + $(first $P errors) ))" >> "$GITHUB_OUTPUT"

      - name: Send report to Teams
        if: always()
        env:
          TEAMS_URL: ${{ secrets.TEAMS_WORKFLOW_URL }}
          PROJECT: Project 2
          JOB_STATUS: ${{ job.status }}
          D_TOTAL: ${{ steps.summary.outputs.d_total }}
          D_FAILED: ${{ steps.summary.outputs.d_failed }}
          A_TOTAL: ${{ steps.summary.outputs.a_total }}
          A_FAILED: ${{ steps.summary.outputs.a_failed }}
          B_TOTAL: ${{ steps.summary.outputs.b_total }}
          B_FAILED: ${{ steps.summary.outputs.b_failed }}
          P_TOTAL: ${{ steps.summary.outputs.p_total }}
          P_FAILED: ${{ steps.summary.outputs.p_failed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/teams-card.sh

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project2-playwright-report
          path: Project2/playwright/playwright-report

      - name: Fail the job if any tests failed
        if: steps.dotnet.outcome == 'failure' || steps.angular.outcome == 'failure' || steps.bruno.outcome == 'failure' || steps.playwright.outcome == 'failure'
        run: exit 1
